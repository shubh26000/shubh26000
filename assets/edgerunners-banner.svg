<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Night City transmission</title>
  <desc id="desc">Animated frosted glass banner with a gentle cyan and magenta edge, Shubham Pandey, and a typing tagline.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0f1a"/><stop offset="1" stop-color="#11162a"/></linearGradient>
    <linearGradient id="edge" x2="1"><stop stop-color="#5fd4d0" stop-opacity=".8"/><stop offset=".52" stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#d46a9f" stop-opacity=".7"/></linearGradient>
    <linearGradient id="shine" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".15"/><stop offset=".45" stop-color="#fff" stop-opacity=".025"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="warp" x="-10%" y="-15%" width="120%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="1" seed="8" result="noise"><animate attributeName="baseFrequency" values=".012 .02;.016 .012;.012 .02" dur="12s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="3"><animate attributeName="scale" values="2;4;2" dur="12s" repeatCount="indefinite"/></feDisplacementMap></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="card"><rect x="26" y="24" width="1148" height="312" rx="28"/></clipPath>
    <clipPath id="typing"><rect x="95" y="244" width="0" height="38"><animate attributeName="width" values="0;440;440;0" keyTimes="0;.35;.78;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <g opacity=".35" filter="url(#blur)"><ellipse cx="260" cy="70" rx="205" ry="80" fill="#5fd4d0"/><ellipse cx="1020" cy="290" rx="235" ry="92" fill="#d46a9f"/></g>
  <g clip-path="url(#card)">
    <rect x="26" y="24" width="1148" height="312" rx="28" fill="#ffffff" fill-opacity=".045" stroke="url(#edge)" stroke-opacity=".72" stroke-width="1.4" filter="url(#warp)"/>
    <rect x="28" y="26" width="1144" height="138" rx="26" fill="url(#shine)"/>
    <path d="M26 76H1174M26 80H1174" stroke="#5fd4d0" stroke-opacity=".08" stroke-width="1"><animate attributeName="opacity" values=".25;.65;.25" dur="8s" repeatCount="indefinite"/></path>
    <text x="78" y="151" fill="#5fd4d0" font-family="monospace" font-size="16" letter-spacing="5">NIGHT CITY // PERSONAL PROFILE</text>
    <text x="76" y="222" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700" font-size="58">Shubham Pandey</text>
    <g clip-path="url(#typing)"><text x="80" y="272" fill="#cfd6e4" font-family="monospace" font-size="20">&gt; <tspan fill="#e8c468">Android Engineer // AI + IoT</tspan></text></g>
    <text x="80" y="272" fill="#5fd4d0" font-family="monospace" font-size="20">
      <animate attributeName="opacity" values="1;1;.88;1" dur="7s" repeatCount="indefinite"/>
      _
    </text>
    <text x="1090" y="305" text-anchor="end" fill="#d46a9f" fill-opacity=".7" font-family="monospace" font-size="12" letter-spacing="3">EDGERUNNER // ONLINE</text>
  </g>
  <style>@media (prefers-reduced-motion: reduce) { animate, set { display: none !important; } #typing rect { width: 440px; } }</style>
</svg>
